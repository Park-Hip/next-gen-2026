<article class="panel card card-refusal">
  <h2>Từ chối</h2>
  {% for line in card.lines %}
  {% if line.kind == 'who' %}
  <p class="who">{{ line.text }}</p>
  {% elif line.kind == 'lead' %}
  <p class="lead">{{ line.text }}</p>
  {% else %}
  <p>{{ line.text }}</p>
  {% endif %}
  {% endfor %}
</article>
