<article class="panel card card-answer">
  <h2>Trả lời</h2>
  {% for line in card.lines %}
  {% if line.kind == 'who' %}
  <p class="who">{{ line.text }}</p>
  {% elif line.kind == 'claim' %}
  <p class="lead">{{ line.text }}</p>
  {% elif line.kind == 'quote' %}
  <blockquote>{{ line.text }}</blockquote>
  {% elif line.kind == 'source' %}
  <p class="source">{{ line.text }}</p>
  {% else %}
  <p>{{ line.text }}</p>
  {% endif %}
  {% endfor %}
</article>
