<article class="panel card card-conflict">
  <h2>Mâu thuẫn</h2>
  {% for line in card.lines %}
  {% if line.kind == 'who' %}
  <p class="who">{{ line.text }}</p>
  {% elif line.kind == 'lead' %}
  <p class="lead">{{ line.text }}</p>
  {% elif line.kind == 'quote' %}
  <blockquote>{{ line.text }}</blockquote>
  {% else %}
  <p>{{ line.text }}</p>
  {% endif %}
  {% endfor %}
</article>
