name: Change proposal
description: Propose a feature or a design change before building it.
labels: [proposal]
body:
  - type: textarea
    id: serves
    attributes:
      label: What it serves
      description: |
        The Mission 2 brief requirement or the promise ID in `docs/mission2/mission1_promises.md` (for example R4, A1).
        If it serves none, park it under "Deferred ideas" in `docs/mission1/playbook.md` instead.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: The observable end state, not the implementation steps.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and exclusions
      description: What changes and what is explicitly out. If it changes a decision, say which; the PR adds an ADR in `docs/decisions/`.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: How to verify
      description: The test cases or commands that prove it, and one manual check with its expected result.
    validations:
      required: true
