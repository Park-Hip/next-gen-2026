# Test cases (giả lập). Rows 1-10 are the test matrix of artifacts.md "Phase 4 - Test matrix" (the numbers the
# Mission 1 promises cite); rows 11-15 come from issue #10, where they are named N1-N5; rows 16-18 are failures
# kept as limitation rows, found by probing v1 on 14/10/2026 (issues #51, #52, #53); row 19 was the limitation #74 and became
# a hard case with #87 (ADR 0014); row 20 is the hard case added with #75; row 18 became a hard case with #83 (ADR 0012), which also added row 21; row 22 (#101) pairs with row 10: the HR GameCo account is granted the document Minh is refused.
# kind: good | hard | limitation, so the report shows the mix the Mission 2 brief asks for.
#   A limitation row states the ideal result, which v1 is known to miss; its check is expected to fail.
# purpose: why the case is tested, in plain Vietnamese for the judges' "Test cases" page: what it sets up, what the system
#   must do and which rule makes it do that, and what would count as a failure; at least two sentences, shown collapsed.
# questions: every wording the case is asked in; each one must get the same result.
# card: answer | conflict | refusal, the card step 7 must show.
# expected_answer: what a correct reply says, the "Kỳ vọng" of the report; read by hand against the actual reply.
# must_cite, may_cite (answer and conflict rows): the reply cites every must_cite document; an answer card
#   cites nothing outside must_cite + may_cite.
# conflict_pair (conflict rows): the pair the rules must find; the card shows both sides.
# key_facts (answer rows): short strings the answer text (the model's sentences) must contain, after NFC,
#   whitespace folding and casefolding (ADR 0006, decision 3 of the #14 plan); reviewed by Hiep.
# must_show (answer and conflict rows): strings the card must show, so both sides of a conflict are visible.
# rules_card (limitation rows, only when the ideal card differs): the card the deterministic rules currently pick.
# conflict_from (conflict rows): "model" when the rules alone must not form the pair and the model's flag adds it
#   (ADR 0014); the card must still show the pair.
# Refusal rows cite nothing: any citation is a failure.
# forbidden_by_rules: outside the asker's scope, so rules guarantee they are never retrieved or cited.
# forbidden_for_llm: inside the scope, so they can be retrieved and only the LLM can avoid citing them.
# must_not_contain: text the reply must never show.
# data_edit (only when needed): the row runs on the data with one line removed and/or metadata fields set
#   (topic, complements, effective_to).
