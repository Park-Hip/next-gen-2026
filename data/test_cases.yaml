# Test cases (giả lập). Rows 1-10 are the test matrix of artifacts.md "Phase 4 - Test matrix" (the numbers the
# Mission 1 promises cite); rows 11-15 come from issue #10, where they are named N1-N5.
# kind: good | hard | limitation, so the report shows the mix the Mission 2 brief asks for.
#   A limitation row states the ideal result, which v1 is known to miss; its check is expected to fail.
# questions: every wording the case is asked in; each one must get the same result.
# card: answer | conflict | refusal, the card step 7 must show.
# expected_answer: what a correct reply says, the "Kỳ vọng" of the report; read by hand against the actual reply.
# must_cite, may_cite (answer rows): the reply cites every must_cite document and nothing outside must_cite + may_cite.
# conflict_pair (conflict rows): the reply cites at least one of the pair; the card shows both.
# Refusal rows cite nothing: any citation is a failure.
# forbidden_by_rules: outside the asker's scope, so rules guarantee they are never retrieved or cited.
# forbidden_for_llm: inside the scope, so they can be retrieved and only the LLM can avoid citing them.
# must_not_contain: text the reply must never show.
# data_edit (only when needed): the row runs on the data with this line removed from one document.
