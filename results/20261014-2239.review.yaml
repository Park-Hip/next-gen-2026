# Hiep's reading of run 20261014-2239 (decision D6). faithful: yes or no, answer cards only. lesson: in Vietnamese.
- row: 1
  faithful: yes
  lesson: Ngày áp dụng trước 01/01/2027 nên hệ thống chọn đúng bản 2 (14 ngày); bản 3 chưa hiệu lực không lọt vào câu trả lời.
  note:
- row: 2
  faithful: yes
