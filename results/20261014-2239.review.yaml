  note: Thiếu ý không tính là không trung thực; ghi lại để theo dõi.
- row: 4
  faithful: yes
  lesson: Câu hỏi khó về quan hệ giữa hai loại ngày nghỉ vẫn trả lời đúng khi điều khoản trả lời trực tiếp; LLM chỉ trích, không suy diễn thêm.
  note:
- row: 5
  faithful: yes
  lesson: Người hỏi thuộc Tập đoàn nhận quy chế Tập đoàn (12 ngày), không bị lẫn quy chế của công ty con - phạm vi áp dụng theo đơn vị hoạt động đúng.
  note:
- row: 6
  faithful:
  lesson: Văn bản liên quan chưa chắc áp dụng cho người hỏi - hỏi thẳng về GameCo nhưng Lan thuộc Tập đoàn nên hệ thống từ chối, không trả lời số ngày của đơn vị khác.
  note:
- row: 7
  faithful:
  lesson: LLM chỉ chọn một bên (PayCo 13 ngày) nhưng quy tắc vẫn dựng thẻ mâu thuẫn và trích cả hai - thẻ do quy tắc quyết định, không do LLM.
  note:
- row: 8
  faithful:
  lesson: Không có quy định làm thêm giờ cho PayCo thì từ chối, không mượn quy định GameCo và không hiện nhầm thẻ mâu thuẫn nghỉ phép.
  note:
- row: 9
  faithful:
  lesson: Chủ đề không có văn bản nào cho người hỏi thì từ chối sạch, không bịa con số công tác phí.
  note:
- row: 10
  faithful:
