  note: Kỳ vọng ghi "nói giống vậy" chỉ đúng một nửa (khác 3 và 5 ngày); xem lại câu kỳ vọng.
- row: 18
  faithful: yes
  lesson: Thẻ trung thực với nguồn nhưng sai loại thẻ - v1 không nhận ra câu hỏi về tương lai ("năm sau") nên dùng quy định đang hiệu lực để trả lời.
