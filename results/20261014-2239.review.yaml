  note:
- row: 11
  faithful:
  lesson: Câu hỏi về dữ liệu cá nhân (số ngày phép còn lại) không có trong văn bản nên từ chối, không lấy số 14 ngày trong quy chế để trả lời thay.
  note:
- row: 12
  faithful:
  lesson: Hai quy định chưa khai báo quan hệ (Tập đoàn 3 ngày, PayCo 5 ngày) thì hiện thẻ mâu thuẫn và chỉ người hỏi đến HR PayCo, không tự chọn bản mới hơn.
  note:
