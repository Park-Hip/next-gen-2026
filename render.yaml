services:
  - type: web
    name: appota-tri-thuc-noi-bo   # decision 7 in the #11 implementation plan
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: pip install uv && uv sync --locked --no-dev
    startCommand: uv run --no-sync uvicorn appota_kb.main:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false   # set only in the Render Dashboard
      - key: SESSION_SECRET
        generateValue: true   # signs the session cookie (ADR 0016)
      - key: DEMO_PASSWORD
        sync: false   # the password shared by the simulated accounts; set by hand in the Render Dashboard (ADR 0016)