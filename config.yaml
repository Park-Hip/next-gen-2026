# Tunable values. Read only through src/appota_kb/core/config.py; see AGENTS.md "Config". Secrets never go here.
retrieval:
  top_k: 5                 # chunks passed on to step 6 (ADR 0002)
  rrf_k: 60                # reciprocal rank fusion constant (ADR 0002)
  bm25_k1: 1.2             # BM25 term-frequency saturation (ADR 0002)
  bm25_b: 0.75             # BM25 length normalisation (ADR 0002)
  embedding_model: gemini-embedding-001  # dense ranking model (ADR 0002)
llm:
  model: gemini-3.8-flash  # step 6 model, pinned (ADR 0003)
  thinking_level: low      # (ADR 0003)
  max_retries: 6           # langchain's default, passed to the SDK (ADR 0003)
  timeout_seconds: 30      # per attempt (decision 6)
  requests_per_minute: 4   # 80% of the 5 RPM AI Studio shows for gemini-3.8-flash (decision 6)
page:
  question_max_chars: 300
  utc_offset_hours: 7      # the default as-of date is today in Vietnam
  answer_cache_size: 256   # demo only; the evaluation never uses it (decision 5)
eval:
  over_cautious_max_share: 0.10  # at most 10% of gated rows over-cautious (Mission 1 V3, ADR 0006)
  confidence: 0.95               # one-sided bound 1 - (1 - confidence)^(1/n) when k is 0 (ADR 0006)
